[project]
name = "estudaplan-backend"
version = "0.1.0"
description = "API e algoritmos de programação dinâmica (Mochila 0/1) do EstudaPlan"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
